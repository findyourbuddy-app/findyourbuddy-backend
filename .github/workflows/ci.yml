name: Backend CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/findyourbuddy
      JWT_SECRET_KEY: ci-test-secret
      SCRAPER_API_KEY: ci-test-scraper-key
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt

      - name: Scan dependencies for known CVEs
        run: uvx pip-audit -r requirements-audit.txt
