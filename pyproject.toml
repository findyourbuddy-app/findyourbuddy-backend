[project]
name = "findyourbuddy-backend"
version = "0.1.0"
description = "FindYourBuddy backend API"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.14.0",
    "bcrypt==4.0.1",
    "email-validator==2.3.0",
    "fastapi==0.115.6",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "slowapi==0.1.9",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-cov==7.1.0",
]
