    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "sentry-sdk[fastapi]==2.68.1",
    "slowapi==0.1.10",
    "sqlalchemy==2.0.52",
    "redis==5.2.1",
    "iyzipay",
    "uvicorn[standard]==0.52.4",
