services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: findyourbuddy
    ports:
      - "5432:5432"
    volumes:
      - findyourbuddy_pgdata:/var/lib/postgresql/data

volumes:
  findyourbuddy_pgdata:
