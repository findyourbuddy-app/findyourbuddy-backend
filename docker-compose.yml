x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Opt-in local Postgres, not started by default -- the backend now points
  # at the real Supabase database via .env's DATABASE_URL. Bring this up
  # explicitly with `docker compose --profile local-db up` if you want an
  # isolated local database instead.
  db:
    image: postgres:17
    restart: unless-stopped
    profiles: ["local-db"]
    logging: *default-logging
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: findyourbuddy
    ports:
      # Loopback-only: this is a debug/local-dev escape hatch, not meant to
      # be reachable from outside the host when this stack runs on a server.
      - "127.0.0.1:5432:5432"
    volumes:
      - findyourbuddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d findyourbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    ports:
      # Loopback-only: redis has no auth configured, so it must never be
      # reachable from the public internet. Backend/scraper reach it over
      # the internal compose network by service name regardless of this.
      - "127.0.0.1:6379:6379"
    volumes:
      - findyourbuddy_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env's REDIS_URL (which is set for the native/non-Docker run)
      # so the containerized backend always talks to the redis service by name.
      REDIS_URL: redis://redis:6379/0
    volumes:
      - findyourbuddy_media:/app/media
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  scraper:
    build: ../findyourbuddy-scraping
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ../findyourbuddy-scraping/.env
    environment:
      # Overrides .env's BACKEND_API_URL (set for the native/non-Docker run)
      # so the scraper reaches the backend service by its container name.
      BACKEND_API_URL: http://backend:8000

  # Opt-in HTTPS edge for real server deployment -- iOS App Store builds
  # require plain HTTP is off by default (ATS), so production traffic must
  # terminate TLS somewhere. Caddy gets a cert from Let's Encrypt automatically
  # for API_DOMAIN and proxies to the backend over the internal network.
  # Bring up with: docker compose --profile production up -d
  # Requires API_DOMAIN (a real domain pointed at this server's IP) and
  # CADDY_EMAIL (for Let's Encrypt expiry notices) set in .env.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["production"]
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - findyourbuddy_caddy_data:/data
      - findyourbuddy_caddy_config:/config

volumes:
  findyourbuddy_pgdata:
  findyourbuddy_media:
  findyourbuddy_redisdata:
  findyourbuddy_caddy_data:
  findyourbuddy_caddy_config:
