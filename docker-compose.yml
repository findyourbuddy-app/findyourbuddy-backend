services:
  # Opt-in local Postgres, not started by default -- the backend now points
  # at the real Supabase database via .env's DATABASE_URL. Bring this up
  # explicitly with `docker compose --profile local-db up` if you want an
  # isolated local database instead.
  db:
    image: postgres:17
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: findyourbuddy
    ports:
      - "5432:5432"
    volumes:
      - findyourbuddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d findyourbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - findyourbuddy_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env's REDIS_URL (which is set for the native/non-Docker run)
      # so the containerized backend always talks to the redis service by name.
      REDIS_URL: redis://redis:6379/0
    volumes:
      - findyourbuddy_media:/app/media
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  scraper:
    build: ../findyourbuddy-scraping
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ../findyourbuddy-scraping/.env
    environment:
      # Overrides .env's BACKEND_API_URL (set for the native/non-Docker run)
      # so the scraper reaches the backend service by its container name.
      BACKEND_API_URL: http://backend:8000

volumes:
  findyourbuddy_pgdata:
  findyourbuddy_media:
  findyourbuddy_redisdata:
